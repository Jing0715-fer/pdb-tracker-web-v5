<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pairwise Viz QA — Molstar (R170)</title>
<style>
  body { margin:0; font-family:system-ui; background:#111; color:#eee; display:flex; flex-direction:column; height:100vh; }
  .header { padding:6px 12px; background:#000; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .header button { padding:5px 12px; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
  .header button.primary { background:#2ecc71; color:#000; font-weight:bold; }
  #viewer { flex:1; position:relative; background:#fff; min-height:300px; }
  #viewer canvas { display:block; }
  #result { height:30vh; background:#000; padding:6px; overflow:auto; }
  #result.collapsed { display:none; }
  #result img { max-height:40vh; border:1px solid #444; margin:2px; }
  #log { height:110px; background:#000; color:#0f0; font-family:monospace; font-size:11px; padding:4px; overflow-y:auto; }
</style>
</head>
<body>
<div class="header">
  <button id="btnR163">R163 labels (spiral offset — OLD)</button>
  <button id="btnR170" class="primary">R170 labels (attachment+tether rings)</button>
  <button id="btnSticks">Sticks only (show_sidechains replica)</button>
  <button id="btnCombo" class="primary">FULL combo (R170: hide CD + sticks + labels + pair labels + lines)</button>
  <button id="btnClear">Clear all</button>
  <span id="status">loading molstar…</span>
</div>
<div id="viewer"></div>
<div id="result"></div>
<div id="log"></div>

<script src="/molstar.js"></script>
<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
function log(m) { logEl.innerHTML += '[' + new Date().toLocaleTimeString() + '] ' + m + '<br>'; logEl.scrollTop = 1e9; }

let viewer = null, plugin = null;

// ---- REAL 4HHB A-B pairwise data (from /api/analyze/run pairwise_interactions) ----
const AB_INTERACTIONS = [
  { type:"hbond",       chain1:"A", resno1:114, resname1:"PRO", atom1:"O",   chain2:"B", resno2:116, resname2:"HIS", atom2:"NE2", distance_A:2.66 },
  { type:"hbond",       chain1:"A", resno1:31,  resname1:"ARG", atom1:"NH1", chain2:"B", resno2:127, resname2:"GLN", atom2:"OE1", distance_A:2.81 },
  { type:"hbond",       chain1:"A", resno1:122, resname1:"HIS", atom1:"ND1", chain2:"B", resno2:30,  resname2:"ARG", atom2:"NH1", distance_A:3.06 },
  { type:"hydrophobic", chain1:"A", resno1:34,  resname1:"LEU", atom1:"CD1", chain2:"B", resno2:124, resname2:"PRO", atom2:"CB",  distance_A:3.6 },
  { type:"hydrophobic", chain1:"A", resno1:107, resname1:"VAL", atom1:"CG2", chain2:"B", resno2:111, resname2:"VAL", atom2:"CG1", distance_A:3.85 },
  { type:"hydrophobic", chain1:"A", resno1:107, resname1:"VAL", atom1:"CG1", chain2:"B", resno2:115, resname2:"ALA", atom2:"CB",  distance_A:3.95 },
  { type:"hydrophobic", chain1:"A", resno1:119, resname1:"PRO", atom1:"CG",  chain2:"B", resno2:55,  resname2:"MET", atom2:"CE",  distance_A:3.97 },
  { type:"hydrophobic", chain1:"A", resno1:119, resname1:"PRO", atom1:"C",   chain2:"B", resno2:33,  resname2:"VAL", atom2:"CG1", distance_A:4.17 },
];
const THREE_TO_ONE = { ALA:"A",ARG:"R",ASN:"N",ASP:"D",CYS:"C",GLN:"Q",GLU:"E",GLY:"G",HIS:"H",ILE:"I",LEU:"L",LYS:"K",MET:"M",PHE:"F",PRO:"P",SER:"S",THR:"T",TRP:"W",TYR:"Y",VAL:"V" };
const chainColors = { A: 0xe74c3c, B: 0x3498db, C: 0x2ecc71, D: 0xe67e22 };

// unique interface residues in input order (mirrors recipe-viz dedup)
function interfaceResidues() {
  const seen = new Set(), out = [];
  for (const c of AB_INTERACTIONS) {
    for (const side of [1, 2]) {
      const ch = c['chain'+side], rn = c['resno'+side], nm = c['resname'+side];
      const key = ch+':'+rn;
      if (!seen.has(key)) { seen.add(key); out.push({ chain: ch, resno: rn, resname: nm }); }
    }
  }
  return out;
}

// ---- buildResidueLoci — EXACT replica of recipe-viz.ts (R166-fixed: unit.elements[i]) ----
function buildResidueLoci(refs) {
  const bundle = window.molstar;
  const SE = bundle?.lib?.structure?.StructureElement;
  const SP = bundle?.lib?.structure?.StructureProperties;
  if (!SE || !SP) return null;
  const structs = plugin.managers.structure.hierarchy.current.structures;
  if (!structs.length) return null;
  const data = structs[0]?.cell?.obj?.data;
  if (!data) return null;
  const refSet = new Set(refs.map(r => `${r.chain}:${r.resno}`));
  const atomMap = new Map();
  for (const ref of refs) if (ref.atomName) atomMap.set(`${ref.chain}:${ref.resno}`, ref.atomName);
  const elementsByUnit = new Map();
  for (const unit of data.units) {
    if (unit.kind !== 0) continue;
    const indices = [];
    for (let i = 0; i < unit.elements.length; i++) {
      const loc = SE.Location.create(data, unit, unit.elements[i]); // R166 fix
      const chainId = SP.chain.auth_asym_id(loc) || SP.chain.label_asym_id(loc);
      const resno = SP.residue.auth_seq_id(loc);
      const key = `${chainId}:${resno}`;
      if (!refSet.has(key)) continue;
      const atomName = atomMap.get(key);
      if (atomName) {
        const atomId = SP.atom.label_atom_id(loc);
        if (atomId !== atomName) continue;
      }
      indices.push(i);
    }
    if (indices.length > 0) elementsByUnit.set(unit, indices);
  }
  if (elementsByUnit.size === 0) return null;
  const elements = [];
  elementsByUnit.forEach((indices, unit) => elements.push({ unit, indices }));
  const loci = new SE.Loci(data, elements);
  const expr = SE.Loci.toExpression(loci);
  return { loci, expr };
}

// ---- hide chains not in [A,B] (per-pair view cleanup) ----
async function hideOtherChains(keep) {
  const structs = plugin.managers.structure.hierarchy.current.structures;
  for (const s of structs) {
    for (const c of (s.components || [])) {
      const tags = c?.cell?.transform?.tags;
      // static per-chain components carry the chain id in their label
      const label = c?.cell?.obj?.label || '';
      const m = /Chain ([A-Z])/.exec(label);
      if (m && !keep.includes(m[1])) {
        plugin.managers.structure.hierarchy.toggleVisibility([c], 'hide');
      }
    }
  }
  log('hid chains other than ' + keep.join(','));
}

async function focusInterface() {
  const refs = interfaceResidues().map(r => ({ chain: r.chain, resno: r.resno }));
  const res = buildResidueLoci(refs);
  if (res) {
    plugin.managers.camera.focusLoci(res.loci, { minRadius: 20 });
    await new Promise(r => setTimeout(r, 700));
    log('focusLoci minRadius=20 on ' + refs.length + ' residues');
  }
}

// ---- show_sidechains replica (recipe-viz.ts show_sidechains step) ----
async function showSidechains() {
  const refs = interfaceResidues().map(r => ({ chain: r.chain, resno: r.resno }));
  const result = buildResidueLoci(refs);
  if (!result) { log('buildResidueLoci returned NULL — no sticks'); return; }
  const structs = plugin.managers.structure.hierarchy.current.structures;
  const sr = structs[0];
  const tag = 'interface-sidechains-' + Date.now();
  const component = await plugin.builders.structure.tryCreateComponentFromExpression(
    sr.cell, result.expr, tag, { tags: ['interface-sidechain'] }
  );
  if (!component) { log('tryCreateComponentFromExpression returned undefined'); return; }
  await plugin.builders.structure.representation.addRepresentation(component, {
    type: "ball-and-stick",
    typeParams: { sizeFactor: 0.2, ignoreHydrogens: true },
  });
  log('ball-and-stick component created for ' + refs.length + ' residues');
  await new Promise(r => setTimeout(r, 600));
}

// ---- labels: R163 placement (spiral shader offsets — current production) ----
async function addLabelsR163() {
  const meas = plugin.managers.structure.measurement;
  const ATTACHMENTS = ['top-left','bottom-right','top-right','bottom-left','middle-left','middle-right'];
  const GOLDEN = 2.39996;
  let idx = 0;
  for (const r of interfaceResidues()) {
    const res = buildResidueLoci([{ chain: r.chain, resno: r.resno }]);
    if (!res) { log('no loci ' + r.resname + r.resno); continue; }
    const i = idx++;
    const attachment = ATTACHMENTS[i % ATTACHMENTS.length];
    const ring = Math.floor(i / ATTACHMENTS.length);
    const theta = i * GOLDEN;
    const radius = 2.2 + ring * 2.8;
    await meas.addLabel(res.loci, {
      labelParams: {
        customText: (THREE_TO_ONE[r.resname]||'?') + r.resno,
        textColor: chainColors[r.chain] ?? 0xffffff,
        textSize: 0.5, sizeFactor: 0.5,
        offsetX: +(Math.cos(theta) * radius).toFixed(2),
        offsetY: +(Math.sin(theta) * radius).toFixed(2),
        offsetZ: 0.3,
        borderWidth: 0.18, borderColor: 0x101010,
        background: false,
        attachment, tether: true, tetherLength: 2.0, tetherBaseWidth: 0.2,
      },
    });
  }
  log('R163 labels added (' + idx + ')');
  await new Promise(r => setTimeout(r, 900));
}

// ---- labels: R170 placement (attachment cycle + tetherLength rings, NO shader offset) ----
async function addLabelsR170() {
  const meas = plugin.managers.structure.measurement;
  // 8 outer attachments (skip middle-center — no tether direction)
  const ATTACHMENTS = ['top-center','top-right','middle-right','bottom-right','bottom-center','bottom-left','middle-left','top-left'];
  let idx = 0;
  for (const r of interfaceResidues()) {
    const res = buildResidueLoci([{ chain: r.chain, resno: r.resno }]);
    if (!res) { log('no loci ' + r.resname + r.resno); continue; }
    const i = idx++;
    const attachment = ATTACHMENTS[i % ATTACHMENTS.length];
    const ring = Math.floor(i / ATTACHMENTS.length);
    const tetherLength = 1.6 + ring * 1.1;   // ring 0..3 → 1.6..4.9 (PD max 5)
    await meas.addLabel(res.loci, {
      labelParams: {
        customText: (THREE_TO_ONE[r.resname]||'?') + r.resno,
        textColor: chainColors[r.chain] ?? 0xffffff,
        textSize: 0.5, sizeFactor: 0.5,
        offsetX: 0, offsetY: 0, offsetZ: 0.4,
        borderWidth: 0.18, borderColor: 0x101010,
        background: false,
        attachment, tether: true, tetherLength, tetherBaseWidth: 0.18,
      },
    });
  }
  log('R170 labels added (' + idx + ')');
  await new Promise(r => setTimeout(r, 900));
}

// ---- pair labels: "PRO114–HIS116 2.7Å" anchored at atom-pair midpoint ----
async function addPairLabels() {
  const meas = plugin.managers.structure.measurement;
  const top = AB_INTERACTIONS.slice(0, 6);
  let n = 0;
  for (const it of top) {
    // loci containing BOTH endpoint atoms → anchor = midpoint between them
    const res = buildResidueLoci([
      { chain: it.chain1, resno: it.resno1, atomName: it.atom1 },
      { chain: it.chain2, resno: it.resno2, atomName: it.atom2 },
    ]);
    if (!res) { log('pair loci miss ' + it.resname1 + it.resno1); continue; }
    const text = `${it.resname1}${it.resno1}–${it.resname2}${it.resno2} ${it.distance_A.toFixed(1)}Å`;
    await meas.addLabel(res.loci, {
      labelParams: {
        customText: text,
        textColor: 0xffd700,
        textSize: 0.42, sizeFactor: 0.42,
        offsetX: 0, offsetY: 0, offsetZ: 0.6,
        borderWidth: 0.16, borderColor: 0x101010,
        background: false,
        attachment: (n % 2 === 0) ? 'top-center' : 'bottom-center',
        tether: true, tetherLength: 0.9, tetherBaseWidth: 0.14,
      },
    });
    n++;
  }
  log('pair labels added (' + n + ')');
}

// ---- H-bond dashed lines (draw_interaction_lines replica) ----
async function drawLines() {
  const meas = plugin.managers.structure.measurement;
  const lines = AB_INTERACTIONS.filter(c => (c.type === 'hbond' || c.type === 'salt_bridge') && c.atom1 && c.atom2);
  for (const c of lines) {
    const r1 = buildResidueLoci([{ chain: c.chain1, resno: c.resno1, atomName: c.atom1 }]);
    const r2 = buildResidueLoci([{ chain: c.chain2, resno: c.resno2, atomName: c.atom2 }]);
    if (r1 && r2) {
      await meas.addDistance(r1.loci, r2.loci);
    } else {
      log('atoms not found: ' + c.chain1 + ':' + c.resno1 + '(' + c.atom1 + ')');
    }
  }
  log('drew ' + lines.length + ' distance lines');
}

function capture(tag) {
  return new Promise(async (resolve) => {
    // collapse the result strip so the LIVE canvas keeps a decent size
    // (this bundle's getImageDataUri ignores width/height args and captures
    // at the current canvas size — see R170 notes)
    const resultEl = document.getElementById('result');
    resultEl.classList.add('collapsed');
    // robust settle (plain timeouts — rAF may never fire in headless/background tabs)
    await new Promise(r => setTimeout(r, 3000));
    try {
      const dataUri = await Promise.race([
        plugin.helpers?.viewportScreenshot?.getImageDataUri({ width: 1200, height: 800, transparency: false, axes: true }),
        new Promise(r2 => setTimeout(() => r2(null), 60000)),
      ]);
      resultEl.classList.remove('collapsed');
      if (dataUri) {
        const img = document.createElement('img');
        img.src = dataUri; img.dataset.mode = tag;
        document.getElementById('result').prepend(img);
        window.__lastShot = dataUri;
        window.__lastTag = tag;
        log('captured (' + tag + ') bytes=' + dataUri.length);
        resolve(dataUri);
        return;
      }
      log('capture returned empty (' + tag + ')');
    } catch (e) { resultEl.classList.remove('collapsed'); log('capture failed: ' + e.message); }
    resolve(null);
  });
}

async function clearAll() {
  try { plugin.managers.structure.measurement.clear(); } catch (e) {}
  // remove sidechain components
  const structs = plugin.managers.structure.hierarchy.current.structures;
  for (const s of structs) {
    const toRemove = [];
    for (const c of (s.components || [])) {
      const tags = c?.cell?.transform?.tags;
      if (Array.isArray(tags) && tags.includes('interface-sidechain')) toRemove.push(c);
    }
    for (const c of toRemove) plugin.managers.structure.hierarchy.remove([c], true);
  }
  // unhide all chains
  for (const s of structs) {
    for (const c of (s.components || [])) {
      plugin.managers.structure.hierarchy.toggleVisibility([c], 'show');
    }
  }
  document.getElementById('result').innerHTML = '';
  window.__lastShot = null;
  log('cleared');
}

async function init() {
  const m = window.molstar;
  if (!m || !m.Viewer) { statusEl.textContent = 'molstar bundle missing'; return; }
  viewer = await m.Viewer.create(document.getElementById('viewer'), {
    layoutIsExpanded: false, layoutShowControls: false,
    layoutShowRemoteState: 'none', layoutShowSequence: false, layoutShowLog: false,
    layoutShowLeftPanel: false, collapseLeftPanel: true, collapseRightPanel: true,
    viewportShowReset: false, viewportShowScreenshotControls: false, viewportShowControls: false,
    viewportShowExpand: false, viewportShowToggleFullscreen: false, viewportShowSettings: false,
    viewportShowSelectionMode: false, viewportShowAnimation: false, viewportShowTrajectoryControls: false,
    pdbProvider: 'pdbe', emdbProvider: 'pdbe',
    viewportBackgroundColor: '#ffffff',
  });
  plugin = viewer.plugin;
  statusEl.textContent = 'loading 4HHB…';
  log('viewer created');
  await viewer.loadPdb('4HHB');
  await new Promise(r => setTimeout(r, 3000));
  try {
    const structs = plugin.managers.structure.hierarchy.current.structures;
    const comps = [];
    for (const s of structs) for (const c of (s.components || [])) comps.push(c);
    plugin.managers.structure.component.updateRepresentationsTheme(comps, { color: 'chain-id' });
  } catch (e) { log('theme failed: ' + e.message); }
  statusEl.textContent = 'ready';
  log('4HHB loaded');

  document.getElementById('btnR163').onclick = async () => { await focusInterface(); await addLabelsR163(); await capture('r163'); };
  document.getElementById('btnR170').onclick = async () => { await focusInterface(); await addLabelsR170(); await capture('r170'); };
  document.getElementById('btnSticks').onclick = async () => { await focusInterface(); await showSidechains(); await capture('sticks'); };
  document.getElementById('btnCombo').onclick = async () => {
    await hideOtherChains(['A','B']);
    await focusInterface();
    await showSidechains();
    await addLabelsR170();
    await addPairLabels();
    await drawLines();
    await capture('combo');
  };
  document.getElementById('btnClear').onclick = clearAll;
}
init().catch(e => { statusEl.textContent = 'init failed: ' + e.message; log('init error: ' + e.message); });
</script>
</body>
</html>
